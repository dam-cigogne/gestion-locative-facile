33 30h1v1h-1zM1 31h1v1h-1zM3 31h1v1h-1zM4 31h1v1h-1zM5 31h1v1h-1zM7 31h1v1h-1zM9 31h1v1h-1zM10 31h1v1h-1zM13 31h1v1h-1zM15 31h1v1h-1zM21 31h1v1h-1zM23 31h1v1h-1zM25 31h1v1h-1zM27 31h1v1h-1zM28 31h1v1h-1zM30 31h1v1h-1zM1 32h1v1h-1zM7 32h1v1h-1zM11 32h1v1h-1zM14 32h1v1h-1zM16 32h1v1h-1zM17 32h1v1h-1zM18 32h1v1h-1zM19 32h1v1h-1zM21 32h1v1h-1zM23 32h1v1h-1zM24 32h1v1h-1zM25 32h1v1h-1zM27 32h1v1h-1zM28 32h1v1h-1zM29 32h1v1h-1zM33 32h1v1h-1zM1 33h1v1h-1zM2 33h1v1h-1zM3 33h1v1h-1zM4 33h1v1h-1zM5 33h1v1h-1zM6 33h1v1h-1zM7 33h1v1h-1zM9 33h1v1h-1zM10 33h1v1h-1zM11 33h1v1h-1zM14 33h1v1h-1zM15 33h1v1h-1zM16 33h1v1h-1zM17 33h1v1h-1zM18 33h1v1h-1zM19 33h1v1h-1zM20 33h1v1h-1zM22 33h1v1h-1zM24 33h1v1h-1zM27 33h1v1h-1zM29 33h1v1h-1zM31 33h1v1h-1z\"/></svg></div><br><small>Scanne ce code avec l’appareil photo : dam-cigogne.github.io/gestion-locative-facile/</small>"}, {"em": "🏠", "t": "L’accueil", "p": "Ton tableau de bord : l’argent, ce qui est en retard, ce qui reste à faire.", "s": [["h1-solde", "hero", "Le solde de tes comptes", "Le gros chiffre, c’est l’argent sur tes comptes appartements. Dessous : le solde de chaque bien en gros, dans la couleur du bien, avec le matelas de sécurité. Touche-le pour ouvrir la page Comptes bancaires."], ["h1-solde", "tabs", "Les 7 onglets", "<span class=\"k\">Accueil</span> · <span class=\"k\">Compta</span> · <span class=\"k\">Ajouter</span> (le + vert) · <span class=\"k\">Pointage</span> · <span class=\"k\">Biens</span> · <span class=\"k\">Location</span> · <span class=\"k\">Bilan</span>. Tu peux aussi les placer sur le côté, on le voit plus loin."], ["h1-solde", "aide", "Le « ? » sur chaque écran", "Il ouvre le mode d’emploi de l’écran où tu es."], ["h1-solde", "maj", "Le bouton de mise à jour", "Les deux flèches circulaires, à côté de la roue : elles vident le cache de l’appli et chargent la toute dernière version. Tes données ne sont pas touchées. Pratique après une mise à jour."], ["h1-solde", "reg", "Les réglages", "La roue dentée ouvre les Réglages, rangés en 5 onglets."], ["h2-tuiles", "tiles", "Trois tuiles à toucher", "Loyers en retard, lignes à pointer, lignes à saisir en compta : chaque tuile t’emmène directement au bon endroit."], ["h2-tuiles", "benef", "Le bénéfice de l’année", "Il ne compte que ce qui est vraiment passé sur le compte (les lignes pointées). Le « prévu » est montré à part."], ["h2-tuiles", "ech", "Les prochaines échéances", "Les loyers et dépenses prévus, dans l’ordre."]]}, {"em": "➕", "t": "Ajouter une opération", "p": "Une opération = une ligne de ton journal, comme dans Excel.", "s": [["a1-ajout", "type", "Quel type ?", "Recette, dépense, épargne (sortie) ou entrée."], ["a1-ajout", "bien", "Pour quel bien ?", "Studio, T2… ou « Les 2 (50/50) » : le montant est coupé en deux automatiquement."], ["a1-ajout", "pad", "Le montant au pavé", "Le montant est proposé d’après le tarif en vigueur, tu peux le changer. En dessous : catégorie, libellé et « Pointé » (l’argent est vraiment passé sur le compte). Les modèles remplissent le formulaire en un appui."], ["a2-hc", "hc", "Hors compta", "Un frais ou un encaissement qui ne doit pas aller dans ta compta (un remboursement entre amis, par exemple) ? Active « Hors compta ». Il compte dans le solde du compte, donc l’écart avec la banque reste juste, mais il disparaît de « À saisir en compta », des totaux de la compta, du bénéfice et du bilan. Dans la liste, il garde une ligne violette avec une étiquette « hors compta »."]]}, {"em": "✅", "t": "Le pointage du mois", "p": "Tu compares avec ton relevé de banque, ligne par ligne.", "s": [["m1-mois", "seg", "Trois vues", "<span class=\"k\">Ce mois</span>, <span class=\"k\">À pointer</span> (passé mais pas encore vérifié) et <span class=\"k\">À saisir en compta</span>. Un filtre par bien juste dessous."], ["m1-mois", "bilan", "Le bilan du mois", "Recettes, dépenses et résultat, d’un coup d’œil."], ["m2-comptes", "cc", "Les comptes de tes biens", "Sous le bilan : pour chaque bien, le solde de l’appli aujourd’hui en gros (lignes pointées), ce qui reste à pointer, et un champ « Solde de ma banque » : tu le changes quand tu veux, l’écart se met à jour et un bouton enregistre l’ajustement. « Comparer avec un relevé » lance l’import. « Comptes bancaires › » ouvre la page complète (rapprochement, placements)."], ["m1-mois", "ops", "Les opérations", "Touche le rond d’une ligne quand tu la vois passer sur ton relevé. Touche la ligne pour la modifier ou la dupliquer."], ["m1-mois", "tout", "Tout pointer", "Pour pointer d’un coup tout ce qui est vérifié."], ["m1-mois", "srch", "Rechercher", "Un mot, un montant, une date ou un mois, dans tout le journal."], ["m1-mois", "exp", "Exporter", "Ouvre la fenêtre d’export : tu choisis les biens, la période et le contenu, en Excel ou en PDF."], ["x1-export", "per", "Exporter tout ce que tu veux", "Coche le Studio, le T2 ou les deux. Choisis le premier et le dernier mois : un mois, plusieurs mois ou plusieurs années d’un coup (raccourcis Ce mois, Cette année, Année dernière, Tout). Puis le contenu : tout, les dépenses seules ou les recettes seules. Idéal pour vérifier tes comptes, contrôler une année ou donner un fichier à ton comptable. Même fenêtre depuis l’onglet Bilan."], ["m1-mois", "clot", "Clôturer le mois", "Tu saisis le solde réel du relevé : l’appli crée l’ajustement si besoin et te propose ce que tu peux mettre de côté."], ["m3-histo", "h", "Reprise de l’historique", "Dans « Saisie en compta », une carte en haut de « À saisir » : tout ce qui est daté jusqu’à la fin de l’année de ta dernière liasse fiscale est marqué d’un coup comme déjà saisi (échéances d’emprunt comprises). « Annuler » juste après si besoin. Ensuite, tu continues mois par mois."]]}, {"em": "🏢", "t": "Les biens", "p": "Un onglet par bien : tout ce qui est lié au logement (loyers, dépenses, travaux, tarifs) et ses documents. Tout ce qui concerne le locataire est dans « Locataires ».", "s": [["b0-loc", "t", "Le locataire actuel, toujours en haut", "Sur chaque bien, la carte « Locataire actuel » reste en premier : son nom, la date du bail, le loyer et son solde (à jour ou en retard). Appeler, SMS ou e-mail en un appui. Elle s’affiche aussi dans Loyers, Dépenses, Locataires, Arrivée/Départ et Documents."], ["b2-vue", "vue", "La vue du bien", "En haut : le solde du compte aujourd’hui, en gros, à comparer avec ta banque. Dessous : solde au 1er janvier, loyers, charges, cash flow, solde prévu au 31/12."], ["b2-vue", "mat", "Matelas et argent utilisable", "12 mois de loyer mis de côté, ce qui est réservé pour les 3 prochains mois, et ce que tu peux utiliser sans te mettre en difficulté."], ["b1-loyers", "seg", "Les sous-onglets", "Vue, Loyers, Dépenses, Travaux, Locataires, Arrivée/Départ, Documents, Tarifs, Rapprochement. Choisis le bien juste dessous."], ["b1-loyers", "chk", "Les loyers, mois par mois", "Touche le rond pour marquer un loyer encaissé. Les loyers en retard sont listés pour être relancés par SMS."], ["b1-loyers", "quit", "Quittance en un appui", "Sur un loyer encaissé, « Quittance » fabrique le PDF, prêt à envoyer."], ["b3-dep", "p", "Les frais partagés", "Les frais partagés (CFE, comptabilité…) se saisissent une fois : l’appli crée une ligne par bien."], ["b3b-dep", "c", "Les dépenses", "Un tableau par catégorie : Total, Payé et Reste, avec une ligne de total. « payé ✓ » quand tout est réglé, sinon le montant qui reste à payer."], ["b3c-ops", "o", "Les opérations, rangées par mois", "Dans Vue et Dépenses, la liste est rangée par mois : un bandeau par mois avec ses recettes, ses dépenses et son résultat. Choisis « Colonnes » (les mois côte à côte, selon la largeur : 3 colonnes sur iPad en paysage, 2 en portrait, 1 sur téléphone), « Par mois », « Tableau » (colonnes Date, Catégorie, Entrée, Sortie, Pointé) ou « Liste », et filtre Tout, Dépenses ou Recettes. Touche une ligne pour la modifier."], ["b4-travaux", "c", "Les travaux", "Une facture par ligne, avec « Scanné » et « Compta » à cocher d’un appui. Recherche par fournisseur ou numéro."], ["b5-loc", "l", "Les locataires", "Une fiche simple : bail, loyer, dépôt de garantie. Appeler, SMS ou e-mail en un appui."], ["b8-tarifs", "t", "Les tarifs", "Loyer, crédit, assurances : quand un montant change, tu crées un nouveau tarif. Touche une ligne de l’historique pour la corriger ou la supprimer. « Changer le jour de prélèvement » déplace en une fois toutes les lignes d’une catégorie au même jour du mois (crédit le 24, assurance le 5…)."]]}, {"em": "🏦", "t": "Les comptes bancaires", "p": "Tout ce qui concerne l’argent des comptes, au même endroit : rapprochement avec la banque, placements, bourse et intérêts.", "s": [["cb0-page", "seg", "La page Comptes bancaires", "On l’ouvre en touchant le gros solde de l’accueil, la carte violette « Bourse, pas dépensé », ou « Comptes bancaires › » dans le Pointage. Deux sous-onglets : <span class=\"k\">Rapprochement</span> et <span class=\"k\">Placements et bourse</span>."], ["cb2-home", "hero", "Depuis l’accueil", "Touche le gros solde de tes comptes : la page Comptes bancaires s’ouvre. La carte violette « Bourse, pas dépensé » ouvre directement l’onglet Placements et bourse."], ["b9-rapp", "c", "Le rapprochement bancaire", "Tu tapes le solde réel de ton relevé : l’appli le compare à son solde calculé et écrit en clair ce que veut dire l’écart (par exemple « la banque a 12 € de moins que l’appli : il manque une dépense de 12 € »). Un bouton crée un ajustement daté si besoin (il compte dans le solde, pas dans le bénéfice, et il est toujours hors compta). Touche une ligne de l’historique des ajustements pour la modifier ou l’annuler."], ["r1-import", "c", "Importer un relevé de banque", "En haut de l’onglet Rapprochement : choisis le bien, puis le fichier de ta banque (PDF, Excel, CSV, OFX) ou colle les lignes. Tu peux choisir plusieurs fichiers d’un coup (toute une année) : l’appli les range du plus ancien au plus récent et ne compte pas deux fois une ligne présente dans deux relevés. Sur un PDF de banque, l’appli lit aussi la ligne « Solde au … » toute seule. Rien n’est enregistré tant que tu n’as pas choisi."], ["r2-resume", "r", "Ce qui est déjà dans l’appli", "L’appli compare chaque ligne du relevé avec tes opérations. Elle te dit combien sont déjà saisies et pointées, et ce qui reste à traiter. « Inverser les signes » ne sert que si les entrées et les sorties sont à l’envers (rare avec un PDF)."], ["r3-ecart", "e", "Trouver mon écart", "Le solde de la banque est lu dans le PDF (sinon tape-le). L’appli le compare à ton « Solde calculé » et détaille d’où vient la différence. Champ facultatif : le solde au début du relevé, pour séparer ce qui vient d’avant le relevé de ce qui vient des lignes."], ["r4-lignes", "m", "Les lignes oubliées", "Pour chaque ligne du relevé absente de l’appli : choisis la catégorie puis « Ajouter » (elle est créée et pointée), ou « Ignorer » si elle ne t’intéresse pas. Une case « Hors compta » (ou le bouton « Tout ajouter en hors compta ») garde la ligne dans le solde de la banque sans la mettre dans ta compta. Le groupe « Caution » de la liste range une caution reçue ou rendue : elle compte dans la banque, jamais dans la compta."], ["r5-ressemble", "s", "Une erreur de montant ou de date ?", "Si une ligne du relevé ressemble à une opération de l’appli (même jour à peu près, montant proche), l’appli te le dit et propose « Corriger l’appli » : le montant et la date du relevé sont repris et la ligne est pointée."], ["r6-dates", "d", "Même opération, date différente", "Même montant mais pas la même date (une taxe saisie au 31/12 alors qu’elle est passée le 26/10) : « Mettre la date du relevé » remet les deux d’accord, et le solde à une date donnée devient juste."], ["cb1-plc", "p", "Placements, bourse et intérêts", "Choisis Tous ou un bien. Tu vois le mis en bourse, le remboursé et le reste à rembourser, puis « Mettre de côté » (livret, bourse…) et « Ajouter des intérêts ». L’historique est dessous, chaque ligne se modifie ou se supprime. L’argent placé reste compté dans le total du bien (exemple avec des données fictives)."]]}, {"em": "🔑", "t": "Louer : du candidat au bail", "p": "De l’annonce jusqu’à la remise des clés, sans serveur : tout passe par ton e-mail.", "s": [["l7-annonce", "c", "1 · L’annonce", "Tu remplis les infos du bien, ajoutes tes photos, puis tu crées le PDF ou tu copies le texte pour un site d’annonces. L’appli te dit ce qu’il manque."], ["l1-cand", "plus", "2 · Les candidats", "« + Candidat » crée une fiche à la main. Ou tu envoies le lien du formulaire de candidature : quand l’e-mail arrive, tu colles le texte et la fiche se remplit."], ["l1-cand", "flt", "Les étapes", "Demande reçue, visite, dossier à vérifier, retenu, refusé : des filtres pour suivre chaque candidat."], ["l3-fiche", "vis", "3 · La fiche et la visite", "Situation, revenus, garant, note… et la <b>date de la visite</b>. L’appli compare les revenus au loyer (3 fois = vert), à titre indicatif seulement."], ["l4-visite", "info", "Visite → agenda 📅", "Dès que tu notes une visite, l’appli te propose de l’envoyer vers AgenDam ou le calendrier du téléphone, avec adresse, nom, téléphone et infos du dossier."], ["l4-visite", "copy", "Copier pour AgenDam", "Le code se colle dans AgenDam. Le fichier .ics (calendrier du téléphone) contient un rappel 1 h avant."], ["l5-permis", "warn", "Permis de louer 🔑", "Si ton logement est dans une commune qui l’impose (comme le centre ancien d’Istres), un gros rappel s’affiche avant d’ajouter un candidat : l’autorisation de la mairie est à obtenir <b>avant la signature du bail</b>."], ["l5-permis", "svc", "Les coordonnées de la mairie", "Service, adresse, téléphone cliquable (préremplis pour Istres, à saisir pour une autre commune)."], ["l5-permis", "rdv", "Rendez-vous et visites de contrôle", "Tu notes le RDV en mairie, la visite de contrôle, la 2e visite : chacun part vers ton agenda."], ["l5-permis", "let", "La lettre de demande", "Un PDF de demande d’autorisation, prêt à envoyer. Tu notes ensuite « Demande déposée » puis « Autorisation obtenue »."], ["l6-keep", "ok", "4 · Retenir le candidat", "Début du bail, loyer, dépôt de garantie (2 mois maximum en meublé, 1 en vide) : le locataire est créé avec son dossier et l’arrivée est préparée."]]}, {"em": "🚪", "t": "Arrivée et départ : les check-lists", "p": "Onglet Biens › Arrivée/Départ : une liste pour le départ d’un locataire, une pour l’arrivée du suivant. Rien n’est oublié.", "s": [["m0-mvt", "i", "Deux listes à cocher", "Tu coches chaque étape au fur et à mesure : la date du jour s’inscrit à côté, et le compteur (ici 2/11) passe au vert quand tout est fait. Les boutons ouvrent directement le bon document."], ["m1-dep", "a", "Départ 1 · Le congé et la date", "Congé reçu et vérifié : préavis du locataire de 1 mois en meublé, 3 mois en logement vide ; côté bailleur, 3 mois (meublé) ou 6 mois (vide) avant la fin du bail, avec un motif légal. Puis la date de départ, et le bouton « Lettre de rappel » qui dit au locataire quoi préparer."], ["m2-dep", "a", "Départ 2 · Inventaire et état des lieux de sortie", "Les boutons ouvrent l’inventaire et l’état des lieux de sortie, repris de ceux de l’entrée : les éléments plus dégradés ressortent en rouge. Puis les signatures, un exemplaire chacun."], ["m3-dep", "a", "Départ 3 · Clés, argent, dépôt", "Clés rendues, compteurs relevés, nouvelle adresse notée. Solde des loyers à jour (lettre d’impayé prête si besoin). Retenues justifiées par devis ou factures, en tenant compte de la vétusté. Dépôt restitué sous 1 mois si l’état de sortie est conforme, 2 mois sinon : « Lettre de restitution » en un appui."], ["m4-dep", "a", "Départ 4 · Pour finir", "Dernière quittance et solde de tout compte, puis le locataire est clos dans l’appli (date de fin du bail) et le bien est prêt pour la prochaine location."], ["m5-arr", "a", "Arrivée 1 · Dossier, diagnostics, bail", "Dossier du candidat vérifié (seulement les pièces autorisées), puis, si ton logement est soumis au permis de louer, une étape « Permis de louer » avec un bouton vers le suivi de la demande, diagnostics à jour (DPE, risques, plomb, électricité, gaz, amiante selon le logement), puis bail préparé et relu avec le locataire grâce au PDF de relecture."], ["m6-arr", "a", "Arrivée 2 · Inventaire, état des lieux, signatures", "En meublé, l’inventaire du mobilier d’entrée est obligatoire ; l’état des lieux d’entrée se fait pièce par pièce avec photos (le locataire peut le compléter sous 10 jours). Tout est signé par les deux parties."], ["m7-arr", "a", "Arrivée 3 · Dépôt, clés, assurance, fiche", "Dépôt de garantie reçu (2 mois maximum en meublé, 1 mois en vide), clés remises et compteurs relevés, attestation d’assurance habitation reçue, puis le locataire enregistré dans l’appli avec dates, loyer, charges et dépôt."]]}, {"em": "👤", "t": "Le dossier du locataire", "p": "Onglet Biens › Locataires : la fiche, ce qu’il doit, l’état des lieux, l’inventaire, le bail et les lettres. Tout ce qui le concerne est réuni ici.", "s": [["d0-solde", "s", "Le solde et l’historique", "Sous la fiche du locataire : ce qu’il a payé et ce qu’il doit depuis le début du bail, mois par mois. Pratique avant l’état de sortie et la restitution du dépôt. En bas, les anciens locataires restent consultables."], ["d1-edl", "edl", "Les états des lieux", "« Nouvel état d’entrée », « État de sortie », ou « Importer un état déjà fait ». En dessous : la liste de tous les états du bien, à rouvrir quand tu veux."], ["d4-edlsheet", "f", "Préparer à l’avance", "Tu peux reprendre la liste d’un autre logement, ou importer un ancien état (PDF, Excel, CSV) : l’appli le recopie vierge, sans les états."], ["d6-edl", "top", "L’état d’entrée : l’en-tête", "Date, locataire, relevés des compteurs (électricité, eau, gaz), nombre de clés remises et détecteur de fumée."], ["d6b-room", "etat", "Pièce par pièce", "Chaque pièce se déplie. Pour chaque élément : l’état (Neuf, Bon, Moyen, Mauvais), une observation, et « + Photo ». Les photos restent sur le téléphone et sont jointes au PDF."], ["d7-sortie", "ref", "L’état de sortie reprend l’entrée", "Tu choisis l’état d’entrée à comparer. Si tu as l’exemplaire d’entrée en fichier (PDF, Excel ou CSV), l’appli le reprend et crée directement la version de sortie."], ["d8-edlsortie", "w", "Ce qui est plus dégradé ressort", "Pour chaque élément, l’état d’entrée est rappelé, et un message rouge apparaît si l’état de sortie est plus dégradé. Les compteurs d’entrée sont rappelés en haut."], ["d1b-inv", "inv", "L’inventaire du mobilier", "Pour un meublé : « Nouvel inventaire d’entrée », « Inventaire de sortie » ou « Importer un inventaire déjà fait ». Les logements vides n’ont pas cette carte."], ["d9-inv", "g", "Les articles, pièce par pièce", "La liste minimale du décret n° 2015-981 est déjà là : tu notes la quantité, l’état et une observation, tu ajoutes tes propres articles ou tu colles une liste. À la sortie, l’entrée est rappelée sous chaque article."], ["d10-pdf", "pdf", "PDF, relecture et signature", "« Créer le PDF », un PDF de relecture à relire avant de signer, la signature à l’écran ou sur papier, et « Garder comme modèle » pour réutiliser la liste sur un autre logement."], ["d11-papier", "ol", "Signer à la main : imprimer, signer, rescanner", "Le locataire (ou toi) veut absolument signer sur papier, ou la signature à l’écran n’est pas possible ? Sur le bail, l’état des lieux ou l’inventaire, touche « Signer sur papier (1 page à imprimer) ». L’appli ajoute à chaque page une référence unique et prépare une dernière page « PAGE DE SIGNATURE ». Tu n’imprimes que cette page (chez toi, au tabac, à la mairie, ou le locataire de son côté) ; bailleur et locataire la signent et la paraphent à la main."], ["d11-papier", "b2", "Puis : scanner et renvoyer", "1 · « Enregistrer le PDF » (il reste aussi dans les documents du logement). 2 · « Scanner la page signée » (photo ou PDF déjà pris) ou « Photographier la page » : l’appareil photo s’ouvre directement, pose la page à plat, bien éclairée ; elle est rangée avec le dossier. Vérifie que la référence est lisible. L’appli range alors dans les documents du logement un PDF « SIGNÉ » unique (le document + la page signée à la main en dernière page) : c’est ton exemplaire à archiver. 3 · « Envoyer le dossier par e-mail » : la fenêtre de partage s’ouvre avec ce PDF signé déjà joint. Pour un bail plus solide, fais parapher chaque page à la main ; en cas de doute, ANIL, notaire ou avocat."], ["d2-bail", "bail", "Le bail meublé", "Un bail rempli avec les données du bien et du locataire, au format PDF. Avant de signer, un « PDF de relecture » sans signature permet de le relire avec le locataire."], ["d3-bailsheet", "f", "Le formulaire du bail", "Bailleur, locataire, logement, loyer, dépôt, durée… L’appli vérifie les points essentiels avant de créer le PDF."], ["d5-lettre", "pdf", "Les lettres", "Loyer impayé, attestation de loyer, restitution du dépôt, rappel avant l’état des lieux de sortie : le PDF est créé en un appui."], ["d5-lettre", "sig", "Signer à l’écran ✍️", "Tu signes au doigt (et le locataire aussi pour la restitution du dépôt). Le PDF signé est rangé dans les documents du logement. En touchant « Continuer », la fenêtre « Envoyer au locataire » s’ouvre : pièce jointe, e-mail, SMS, « Ranger dans sa fiche » ou Fichiers."], ["e1-envoi", "info", "Envoyer au locataire", "Partout où l’appli crée un PDF pour le locataire (bail, état des lieux, inventaire, lettres, quittance, restitution du dépôt), un bouton « Envoyer au locataire » apparaît. Ses coordonnées sont déjà connues. Tu coches d’abord ce que tu veux garder (copie dans sa fiche, enregistrement sur l’appareil), puis tu choisis comment envoyer : tout se fait au même endroit."], ["e1-envoi", "att", "Le PDF en pièce jointe", "Le partage de ton téléphone s’ouvre avec le PDF joint (Mail, Messages, WhatsApp…). L’e-mail du locataire est copié : colle-le dans « À : ». Une appli sur navigateur ne peut pas joindre le PDF ET remplir le destinataire à ta place : l’envoi reste à valider par toi."], ["e1-envoi", "mail", "E-mail ou SMS déjà rédigés", "Sans PDF : un e-mail (destinataire, objet du type « Inventaire de sortie – Studio – 12/02/2027 » et texte) ou un SMS prêts à envoyer. S’il n’y a pas d’e-mail ou de téléphone, l’appli le dit et ouvre la fiche du locataire."], ["d5-lettre", "env", "Le bouton dans chaque feuille", "Bail, lettres, quittance, état des lieux, inventaire : « Envoyer au locataire » est à côté de « Créer le PDF »."], ["v1-verrou", "ban", "Un document signé est verrouillé 🔒", "Une fois l’état des lieux ou l’inventaire signé, ses champs ne se modifient plus : le dossier reste intact. En cas d’erreur, « Déverrouiller (exceptionnel) » ouvre le document, mais la première modification efface les signatures et il faut le faire signer de nouveau."], ["e1-envoi", "att", "Ranger dans sa fiche", "« Ranger dans sa fiche » garde une copie du PDF (signé s’il l’est) dans Biens › Locataires › sa fiche › Documents, sans rien envoyer. Un envoi en pièce jointe en garde aussi une copie."]]}, {"em": "📁", "t": "Les documents du bien", "p": "Onglet Biens › Documents : les modèles vierges à imprimer, les pièces à joindre au bail et les papiers du logement.", "s": [["l0-docs", "mod", "Modèles vierges à imprimer", "Bail, état des lieux, inventaire, lettres types : des PDF sans aucune donnée, à imprimer et remplir à la main. Pour un document rempli avec un locataire, va dans Locataires."], ["l0-docs", "ann", "Pièces à joindre au bail", "Importe chaque pièce une fois (diagnostics, notice d’information…) : elle est cochée ici et jointe à l’annexe du bail."], ["l0-docs", "aut", "Documents du bien", "DPE, assurance PNO, taxe foncière, copropriété… gardés avec le dossier du logement, sur ton téléphone."]]}, {"em": "📊", "t": "La compta", "p": "Tout ce qu’il faut pour remplir ta compta en ligne, sans rien oublier.", "s": [["c1-an", "an", "L’année en gros", "Tu changes d’année avec les pastilles. Une fois fini : « Clôturer : compta faite » et l’année s’affiche en vert."], ["c1-an", "site", "Date limite et site de compta", "Tu notes la date limite publiée chaque printemps et le site que tu utilises (facultatif) : l’appli te rappelle « Vous avez jusqu’au… »."], ["c2-saisir", "tabs", "À saisir sur le site", "Dépenses, recettes, échéances d’emprunt, logement par logement. Tu coches une ligne, un mois ou tout."], ["c2-saisir", "do", "Marquer comme saisi", "Une erreur ? « Annuler » pendant 12 secondes, ou « Déjà saisi » pour remettre des lignes à saisir."], ["c2-saisir", "do2", "Replier la liste", "Le bouton « Replier » en haut de la carte cache toute la liste : la liasse fiscale, « Détails, chiffres et export » et le reste sont alors visibles sans faire défiler. « Déplier » la rouvre."], ["c2-saisir", "vue", "Vue d’ensemble", "Tout ce qu’il faut saisir, d’un coup d’œil, avec zoom."], ["c3-vue", "c", "Pour le jour où tu es devant le site", "Une case par ligne, un filtre « reste à saisir », et un PDF à imprimer (complet ou seulement le reste)."], ["c4-liasse", "l", "La liasse fiscale", "Importe le PDF ou la photo de chaque année pour la retrouver ici. Les chiffres et la liste « À ne pas oublier » sont dans « Détails »."], ["c5-emprunt", "i", "Importer l’échéancier de la banque", "Dans Compta › Emprunt et intérêts, touche « Renseigner » puis « Importer l’échéancier de la banque » : PDF, scan, Excel ou CSV. L’appli lit le tableau, vérifie chaque ligne et reconstruit les échéances exactes. Tu compares les intérêts de chaque année avec ceux de ta banque, puis « Utiliser cet échéancier ». Les intérêts et l’assurance de la compta sont alors ceux de la banque, année après année (exemple avec un prêt fictif)."], ["c6-echeancier", "p", "Où en est mon prêt ?", "Sur la carte Emprunt, touche « Échéancier complet ». Tu vois le capital restant dû aujourd’hui, les intérêts déjà payés, ce qu’il reste à payer, une barre de progression et le capital restant dû à la fin de chaque année. Touche une année pour voir ses échéances mois par mois ; les lignes grisées sont à venir. Boutons Excel et PDF en bas (exemple avec un prêt fictif)."]]}, {"em": "📈", "t": "Le bilan", "p": "Les chiffres de l’année, bien par bien.", "s": [["g1-bilan", "c", "Cash flow et performance", "Cash flow, bilan par bien, performance mois par mois, toutes les années. Export Excel ou PDF d’un mois ou d’une année."], ["g2-analyse", "c", "Pourquoi mes années sont différentes ?", "Une page dédiée dans le Bilan. Tu choisis deux années (et un bien) : l’appli montre le cash flow de chacune, l’écart, les raisons principales et un graphique. Vert à droite = ça améliore le cash flow, rouge à gauche = ça le baisse. En bas de la page, deux boutons exportent l’analyse en Excel ou en PDF."], ["g3-cat", "c", "Par catégorie", "Un tableau des deux années, catégorie par catégorie, avec l’effet de chacune sur le cash flow. Touche une ligne pour voir les opérations de chaque année : dépense ponctuelle, mensualité manquante, montant qui a changé…"], ["g4-mois", "c", "Mois par mois", "Loyers, charges et cash flow de chaque mois pour les deux années. Les mois qui s’écartent le plus sont surlignés, avec ce qui les explique (taxe foncière payée un autre mois, dépense ponctuelle…). Touche un mois pour voir le détail de chaque opération : date, libellé de ce qui a été acheté, fournisseur et note, année contre année. Pratique pour comprendre pourquoi une année est meilleure qu’une autre."]]}, {"em": "⚙️", "t": "Les réglages", "p": "Tout est centralisé ici, rangé en 5 onglets.", "s": [["s1-biens", "seg", "Cinq onglets", "<span class=\"k\">Biens</span>, <span class=\"k\">Données</span>, <span class=\"k\">Aspect</span>, <span class=\"k\">Règles</span>, <span class=\"k\">Aide</span>. Plus besoin de défiler pour trouver un réglage."], ["s1c-idb", "id", "Ta pièce d’identité de bailleur", "Dans Biens, la carte « Bailleur et biens » permet de ranger ta pièce d’identité sur l’appareil. Quand tu fais signer à l’écran, la case « Ma pièce d’identité jointe » est alors cochée toute seule dans « Renforcer la preuve »."], ["s1b-permis", "p", "Permis de louer", "Tu indiques les logements concernés et la commune ; coordonnées de la mairie à renseigner si ce n’est pas Istres."], ["s1b-permis", "a", "Agenda pour les visites", "AgenDam par défaut, modifiable, ou aucun. Le calendrier du téléphone est toujours proposé."], ["s2-data", "c", "Sauvegardes et Excel", "Export Excel du journal, sauvegardes légère ou complète, synchronisation avec ton classeur Excel (sans jamais écraser tes formules), archives."], ["s2b-sec", "sec", "Sécurité", "Verrouillage par code et Face ID (dans l’appli installée sur l’écran d’accueil)."], ["s3-look", "c", "Aspect et confort", "Couleurs, mode clair ou sombre, écran de démarrage, rappel quotidien des lignes à pointer."], ["s3c-fun", "c", "Style Normal ou Fun ✨", "Dans Aspect › « Style de l’appli » : Normal (comme dans toute cette visite) ou Fun, plus rond et plus coloré : cartes arrondies, dégradés, boutons en pilule. Il se combine avec la couleur de l’appli et le mode clair ou sombre. Tu peux revenir à Normal à tout moment."], ["s3b-cote", "rail", "Onglets sur le côté", "Dans Aspect › Onglets : « En haut » ou « Sur le côté » pour les filtres. Ici, sur le côté, ils restent sous le pouce."], ["s4-regl", "fe", "Facture électronique", "Depuis le 1er septembre 2026, un loueur en meublé doit pouvoir recevoir les factures de ses fournisseurs via une plateforme agréée. Tu notes la plateforme et son lien : un bouton « Ouvrir » apparaît sur l’accueil."], ["s4b-maj", "maj", "Règles à jour", "Un export Word guidé pour une IA, une réponse importée ligne par ligne avec les sources officielles. Rien n’est appliqué sans ton accord."], ["s5-aide", "c", "Démo, visite guidée, guide", "Ici tu retrouves à tout moment la visite guidée plein écran et le guide à lire (deux pages web), le mode démo (des données d’exemple, rien n’est enregistré), le mode d’emploi et le parcours guidé."]]}];
const FIN={"em": "🎉", "t": "Tu connais tout !", "p": "Il ne reste qu’à essayer. Commence par créer tes biens, ou teste d’abord avec la démo."};
const Q=[];C.forEach((c,ci)=>{Q.push({card:c,ci});(c.s||[]).forEach(s=>Q.push({ci,img:s[0],mk:s[1],t:s[2],p:s[3]}))});Q.push({card:FIN,fin:1,ci:C.length});
let i=0;const $=s=>document.querySelector(s);
Q.forEach(q=>{if(q.img){const im=new Image();im.src='guide/'+q.img+'.jpg?v=20261108g'}});
function box(q){if(q.mk==='*')return[50,30,100,40];const f=(FIX[q.img]||{})[q.mk];return f||((MK[q.img]||{})[q.mk])||[50,50,80,10]}
function show(){

function go(n){i=Math.max(0,Math.min(Q.length-1,i+n));show()}
function confetti(){const E=['🎉','🏠','🔑','💶','⭐','🎊','✨'];for(let k=0;k<40;k++){const s=document.createElement('span');s.className='conf';s.textContent=E[k%E.length];s.style.left=Math.random()*100+'vw';s.style.animationDuration=(2.5+Math.random()*2.5)+'s';s.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),6500)}}

let tx0=null;document.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});
