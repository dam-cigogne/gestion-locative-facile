33 30h1v1h-1zM1 31h1v1h-1zM3 31h1v1h-1zM4 31h1v1h-1zM5 31h1v1h-1zM7 31h1v1h-1zM9 31h1v1h-1zM10 31h1v1h-1zM13 31h1v1h-1zM15 31h1v1h-1zM21 31h1v1h-1zM23 31h1v1h-1zM25 31h1v1h-1zM27 31h1v1h-1zM28 31h1v1h-1zM30 31h1v1h-1zM1 32h1v1h-1zM7 32h1v1h-1zM11 32h1v1h-1zM14 32h1v1h-1zM16 32h1v1h-1zM17 32h1v1h-1zM18 32h1v1h-1zM19 32h1v1h-1zM21 32h1v1h-1zM23 32h1v1h-1zM24 32h1v1h-1zM25 32h1v1h-1zM27 32h1v1h-1zM28 32h1v1h-1zM29 32h1v1h-1zM33 32h1v1h-1zM1 33h1v1h-1zM2 33h1v1h-1zM3 33h1v1h-1zM4 33h1v1h-1zM5 33h1v1h-1zM6 33h1v1h-1zM7 33h1v1h-1zM9 33h1v1h-1zM10 33h1v1h-1zM11 33h1v1h-1zM14 33h1v1h-1zM15 33h1v1h-1zM16 33h1v1h-1zM17 33h1v1h-1zM18 33h1v1h-1zM19 33h1v1h-1zM20 33h1v1h-1zM22 33h1v1h-1zM24 33h1v1h-1zM27 33h1v1h-1zM29 33h1v1h-1zM31 33h1v1h-1z\"/></svg></div><br><small>Scanne ce code avec l’appareil photo : dam-cigogne.github.io/gestion-locative-facile/</small>"}, {"em": "⭐", "t": "Les points forts en un coup d’œil", "p": "<b>🏠 Tout le dossier du locataire</b> : fiche, bail, état des lieux, inventaire, lettres, au même endroit.<br><b>✍️ Signatures</b> à l’écran ou sur papier, document verrouillé une fois signé.<br><b>📤 Envoi au locataire</b> en une fenêtre : Mail, Outlook, SMS, PDF joint, copie rangée dans sa fiche.<br><b>👀 Vues compactes</b> de l’état des lieux et de l’inventaire pour la visite.<br><b>🏛️ Permis de louer</b> suivi dans l’arrivée et le départ.<br><b>🏦 Rapprochement</b> avec le relevé de banque, <b>📊 compta</b>, liasse, emprunt et <b>📈 bilan</b>.<br><b>🔒 Données chez toi</b>, démo sans rien enregistrer."}, {"em": "🏠", "t": "L’accueil", "p": "Ton tableau de bord : l’argent, ce qui est en retard, ce qui reste à faire.", "s": [["h1-solde", "hero", "Le solde de tes comptes", "Le gros chiffre, c’est l’argent sur tes comptes appartements. Dessous : le solde de chaque bien en gros, dans la couleur du bien, avec le matelas de sécurité. Touche-le pour ouvrir la page Comptes bancaires."], ["h1-solde", "tabs", "Les 7 onglets", "<span class=\"k\">Accueil</span> · <span class=\"k\">Compta</span> · <span class=\"k\">Ajouter</span> (le + vert) · <span class=\"k\">Pointage</span> · <span class=\"k\">Biens</span> · <span class=\"k\">Location</span> · <span class=\"k\">Bilan</span>. Tu peux aussi les placer sur le côté, on le voit plus loin."], ["h1-solde", "aide", "Le « ? » sur chaque écran", "Il ouvre le mode d’emploi de l’écran où tu es."], ["h1-solde", "maj", "Le bouton de mise à jour", "Les deux flèches circulaires, à côté de la roue : elles vident le cache de l’appli et chargent la toute dernière version. Tes données ne sont pas touchées. Pratique après une mise à jour."], ["h1-solde", "reg", "Les réglages", "La roue dentée ouvre les Réglages, rangés en 6 onglets (le dernier, « Mise à jour », liste toutes les versions et met l’appli à jour)."], ["h2-tuiles", "tiles", "Trois tuiles à toucher", "La note d’une ligne s’affiche sous son libellé. Loyers en retard, lignes à pointer, lignes à saisir en compta : chaque tuile t’emmène directement au bon endroit."], ["h2-tuiles", "benef", "Le bénéfice de l’année", "Il ne compte que ce qui est vraiment passé sur le compte (les lignes pointées). Le « prévu » est montré à part."], ["h2-tuiles", "ech", "Les prochaines échéances", "Les loyers et dépenses prévus, dans l’ordre."]]}, {"em": "➕", "t": "Ajouter une opération", "p": "Une opération = une ligne de ton journal, comme dans Excel.", "s": [["a1-ajout", "type", "Quel type ?", "Recette, dépense, épargne (sortie) ou entrée."], ["a1-ajout", "bien", "Pour quel bien ?", "Studio, T2… ou « Les 2 (50/50) » : le montant est coupé en deux automatiquement."], ["a1-ajout", "pad", "Le montant au pavé", "Le montant est proposé d’après le tarif en vigueur, tu peux le changer. En dessous : catégorie, libellé et « Pointé » (l’argent est vraiment passé sur le compte). Les modèles remplissent le formulaire en un appui."], ["a2-hc", "hc", "Hors compta", "Un frais ou un encaissement qui ne doit pas aller dans ta compta (un remboursement entre amis, par exemple) ? Active « Hors compta ». Il compte dans le solde du compte, donc l’écart avec la banque reste juste, mais il disparaît de « À saisir en compta », des totaux de la compta, du bénéfice et du bilan. Dans la liste, il garde une ligne violette avec une étiquette « hors compta »."]]}, {"em": "✅", "t": "Le pointage du mois", "p": "Tu compares avec ton relevé de banque, ligne par ligne.", "s": [["m1-mois", "seg", "Trois vues", "<span class=\"k\">Ce mois</span>, <span class=\"k\">À pointer</span> (passé mais pas encore vérifié) et <span class=\"k\">À saisir en compta</span>. Un filtre par bien juste dessous."], ["m1-mois", "bilan", "Le bilan du mois", "Recettes, dépenses et résultat, d’un coup d’œil."], ["m2-comptes", "cc", "Les comptes de tes biens", "Sous le bilan : pour chaque bien, le solde de l’appli aujourd’hui en gros (lignes pointées), ce qui reste à pointer, et un champ « Solde de ma banque » : tu le changes quand tu veux, l’écart se met à jour et un bouton enregistre l’ajustement. « Comparer avec un relevé » lance l’import. « Comptes bancaires › » ouvre la page complète (rapprochement, placements)."], ["m1b-ops", "ops", "Les opérations", "Touche le rond d’une ligne quand tu la vois passer sur ton relevé. Touche la ligne pour la modifier ou la dupliquer."], ["m1b-ops", "tout", "Tout pointer", "Pour pointer d’un coup tout ce qui est vérifié."], ["m1-mois", "srch", "Rechercher", "Un mot, un montant, une date ou un mois, dans tout le journal."], ["m1-mois", "exp", "Exporter", "Ouvre la fenêtre d’export : tu choisis les biens, la période et le contenu, en Excel ou en PDF."], ["x1-export", "per", "Exporter tout ce que tu veux", "Coche le Studio, le T2 ou les deux. Choisis le premier et le dernier mois : un mois, plusieurs mois ou plusieurs années d’un coup (raccourcis Ce mois, Cette année, Année dernière, Tout). Puis le contenu : tout, les dépenses seules ou les recettes seules. Idéal pour vérifier tes comptes, contrôler une année ou donner un fichier à ton comptable. Même fenêtre depuis l’onglet Bilan."], ["m1-mois", "clot", "Clôturer le mois", "Tu saisis le solde réel du relevé : l’appli crée l’ajustement si besoin et te propose ce que tu peux mettre de côté."], ["m3-histo", "h", "Reprise de l’historique", "Dans « Saisie en compta », une carte en haut de « À saisir » : tout ce qui est daté jusqu’à la fin de l’année de ta dernière liasse fiscale est marqué d’un coup comme déjà saisi (échéances d’emprunt comprises). « Annuler » juste après si besoin. Ensuite, tu continues mois par mois."]]}, {"em": "🏢", "t": "Les biens", "p": "Un onglet par bien : tout ce qui est lié au logement (loyers, dépenses, travaux, tarifs) et ses documents. Tout ce qui concerne le locataire est dans « Locataires ».", "s": [["b0-loc", "t", "Le locataire actuel, toujours en haut", "Sur chaque bien, la carte « Locataire actuel » reste en premier : son nom, la date du bail, le loyer et son solde (à jour ou en retard). Appeler, SMS ou e-mail en un appui. Elle s’affiche aussi dans Loyers, Dépenses, Locataires, Arrivée/Départ et Documents."], ["b2-vue", "vue", "La vue du bien", "En haut : le solde du compte aujourd’hui, en gros, à comparer avec ta banque. Dessous : solde au 1er janvier, loyers, charges, cash flow, solde prévu au 31/12."], ["b2-vue", "mat", "Matelas et argent utilisable", "12 mois de loyer mis de côté, ce qui est réservé pour les 3 prochains mois, et ce que tu peux utiliser sans te mettre en difficulté."], ["b1-loyers", "seg", "Les sous-onglets", "Vue, Loyers, Dépenses, Travaux, Locataires, Arrivée/Départ, Documents, Tarifs, Rapprochement. Choisis le bien juste dessous."], ["b1-loyers", "chk", "Les loyers, mois par mois", "Touche le rond pour marquer un loyer encaissé. Les loyers en retard sont listés pour être relancés par SMS."], ["b1-loyers", "quit", "Quittance en un appui", "Sur un loyer encaissé, « Quittance » fabrique le PDF, prêt à envoyer."], ["b3-dep", "p", "Les frais partagés", "Les frais partagés (CFE, comptabilité, CGA, abonnement…) se saisissent une seule fois : l’appli crée une ligne par compte. Le crayon ✎ modifie un frais, « + Ajouter un frais partagé » en crée un nouveau, et « Saisir » enregistre la dépense."], ["b3b-edit", "pc", "Modifier, ajouter, supprimer un frais", "Le crayon ouvre la fiche du frais : tu changes son nom et sa catégorie dans la compta, tu coches les comptes concernés (2, 3 ou plus selon tes biens) et tu donnes la part de chacun en %. Le total doit faire 100 %, l’appli te le dit en direct. Le bouton Supprimer retire le frais de la liste (les lignes déjà créées restent)."], ["b3c-saisie", "pc", "Saisir un frais sur 3 comptes", "Tu tapes le total une seule fois. L’appli répartit selon les parts (ici 40 / 35 / 25 % de 600 € : 240 + 210 + 150 €) et crée une ligne de dépense par compte. Les parts restent modifiables pour cette saisie, et le dernier total est mémorisé."], ["b3b-dep", "c", "Les dépenses", "Un tableau par catégorie : Total, Payé et Reste, avec une ligne de total. « payé ✓ » quand tout est réglé, sinon le montant qui reste à payer."], ["b3c-ops", "o", "Les opérations, rangées par mois", "Dans Vue et Dépenses, la liste est rangée par mois : un bandeau par mois avec ses recettes, ses dépenses et son résultat. Choisis « Colonnes » (les mois côte à côte, selon la largeur : 3 colonnes sur iPad en paysage, 2 en portrait, 1 sur téléphone), « Par mois », « Tableau » (colonnes Date, Catégorie, Entrée, Sortie, Pointé) ou « Liste », et filtre Tout, Dépenses ou Recettes. Touche une ligne pour la modifier."], ["b4-travaux", "c", "Les travaux", "Une facture par ligne, avec « Scanné » et « Compta » à cocher d’un appui. Recherche par fournisseur ou numéro."], ["b5-loc", "l", "Les locataires", "Une fiche simple : bail, loyer, dépôt de garantie. Appeler, SMS ou e-mail en un appui."], ["b8-tarifs", "t", "Les tarifs", "Loyer, crédit, assurances : quand un montant change, tu crées un nouveau tarif. Touche une ligne de l’historique pour la corriger ou la supprimer. « Changer le jour de prélèvement » déplace en une fois toutes les lignes d’une catégorie au même jour du mois (crédit le 24, assurance le 5…)."]]}, {"em": "🏦", "t": "Les comptes bancaires", "p": "Tout ce qui concerne l’argent des comptes, au même endroit : rapprochement avec la banque, placements, bourse et intérêts.", "s": [["cb0-page", "seg", "La page Comptes bancaires", "On l’ouvre en touchant le gros solde de l’accueil, la carte violette « Bourse, pas dépensé », ou « Comptes bancaires › » dans le Pointage. Deux sous-onglets : <span class=\"k\">Rapprochement</span> et <span class=\"k\">Placements et bourse</span>."], ["cb2-home", "hero", "Depuis l’accueil", "Touche le gros solde de tes comptes : la page Comptes bancaires s’ouvre. La carte violette « Bourse, pas dépensé » ouvre directement l’onglet Placements et bourse."], ["b9-rapp", "c", "Le rapprochement bancaire", "Tu tapes le solde réel de ton relevé : l’appli le compare à son solde calculé et écrit en clair ce que veut dire l’écart (par exemple « la banque a 12 € de moins que l’appli : il manque une dépense de 12 € »). Un bouton crée un ajustement daté si besoin (il compte dans le solde, pas dans le bénéfice, et il est toujours hors compta). Touche une ligne de l’historique des ajustements pour la modifier ou l’annuler.<br><br><b>Exemple chiffré :</b> l’appli calcule <b>2 340,00 €</b> sur le compte du Studio, ta banque affiche <b>2 328,00 €</b>. Écart : <b>−12,00 €</b>, donc « la banque a 12 € de moins que l’appli : il manque une dépense de 12 € » (un abonnement prélevé que tu n’as pas saisi). Tu saisis cette dépense, ou tu enregistres l’ajustement : l’écart passe à 0 et les deux soldes sont d’accord. Si c’est la banque qui a 12 € de plus, il manque une recette dans l’appli."], ["r1-import", "c", "Importer un relevé de banque", "En haut de l’onglet Rapprochement : choisis le bien, puis le fichier de ta banque (PDF, Excel, CSV, OFX) ou colle les lignes. Tu peux choisir plusieurs fichiers d’un coup (toute une année) : l’appli les range du plus ancien au plus récent et ne compte pas deux fois une ligne présente dans deux relevés. Sur un PDF de banque, l’appli lit aussi la ligne « Solde au … » toute seule. Rien n’est enregistré tant que tu n’as pas choisi."], ["r2-resume", "r", "Ce qui est déjà dans l’appli", "L’appli compare chaque ligne du relevé avec tes opérations. Elle te dit combien sont déjà saisies et pointées, et ce qui reste à traiter. « Inverser les signes » ne sert que si les entrées et les sorties sont à l’envers (rare avec un PDF)."], ["r3-ecart", "e", "Trouver mon écart", "Le solde de la banque est lu dans le PDF (sinon tape-le). L’appli le compare à ton « Solde calculé » et détaille d’où vient la différence. Champ facultatif : le solde au début du relevé, pour séparer ce qui vient d’avant le relevé de ce qui vient des lignes."], ["r4-lignes", "m", "Les lignes oubliées", "Pour chaque ligne du relevé absente de l’appli : choisis la catégorie puis « Ajouter » (elle est créée et pointée), ou « Ignorer » si elle ne t’intéresse pas. Une case « Hors compta » (ou le bouton « Tout ajouter en hors compta ») garde la ligne dans le solde de la banque sans la mettre dans ta compta. Le groupe « Caution » de la liste range une caution reçue ou rendue : elle compte dans la banque, jamais dans la compta."], ["r5-ressemble", "s", "Une erreur de montant ou de date ?", "Si une ligne du relevé ressemble à une opération de l’appli (même jour à peu près, montant proche), l’appli te le dit et propose « Corriger l’appli » : le montant et la date du relevé sont repris et la ligne est pointée."], ["r6-dates", "d", "Même opération, date différente", "Même montant mais pas la même date (une taxe saisie au 31/12 alors qu’elle est passée le 26/10) : « Mettre la date du relevé » remet les deux d’accord, et le solde à une date donnée devient juste."], ["cb1-plc", "p", "Placements, bourse et intérêts", "Choisis Tous ou un bien. Tu vois le mis en bourse, le remboursé et le reste à rembourser, puis « Mettre de côté » (livret, bourse…) et « Ajouter des intérêts ». L’historique est dessous, chaque ligne se modifie ou se supprime. L’argent placé reste compté dans le total du bien (exemple avec des données fictives)."]]}, {"em": "🔑", "t": "Louer : du candidat au bail", "p": "De l’annonce jusqu’à la remise des clés, sans serveur : tout passe par ton e-mail.", "s": [["l7-annonce", "c", "1 · L’annonce", "Tu remplis les infos du bien, ajoutes tes photos, puis tu crées le PDF ou tu copies le texte pour un site d’annonces. L’appli te dit ce qu’il manque."], ["l1-cand", "plus", "2 · Les candidats", "« + Candidat » crée une fiche à la main. Ou tu envoies le lien du formulaire de candidature : quand l’e-mail arrive, tu colles le texte et la fiche se remplit."], ["l8-lien", "c", "Le formulaire de candidature", "Dans « Candidats », une carte donne le lien de ton formulaire en ligne : « Copier le lien » ou « Partager le lien » (SMS, e-mail, WhatsApp, site d’annonce). Il faut avoir indiqué ton e-mail dans « Annonce › Modifier » : c’est à cette adresse que les candidatures arrivent."], ["f1-cand", "coord", "Ce que voit le candidat", "Une page simple, sans compte ni application à installer : le logement et le loyer en haut, puis son nom, son téléphone et son e-mail."], ["f2-situation", "s", "Ce qu’il remplit", "Situation professionnelle, revenus nets, nombre d’occupants, date d’emménagement, garant et revenus du garant, un message. Il peut joindre ses pièces (photos ou PDF) ou les apporter à la visite : seules les pièces autorisées par la loi sont demandées."], ["f3-texte", "t", "Son e-mail est préparé", "Il coche son accord et touche « Préparer mon e-mail » : le texte de sa candidature s’affiche, puis « Ouvrir mon e-mail » l’envoie à ton adresse. Rien n’est enregistré sur un serveur."], ["l9-coller", "t", "Tu colles, la fiche se remplit", "Tu reçois l’e-mail : tu copies le texte, puis « Coller une candidature ou un dossier reçu » et « Créer la fiche ». Nom, contact, revenus, garant et message sont déjà remplis, et l’appli compare les revenus au loyer."], ["l1-cand", "flt", "Les étapes", "Demande reçue, visite, dossier à vérifier, retenu, refusé : des filtres pour suivre chaque candidat."], ["l3-fiche", "vis", "3 · La fiche et la visite", "Situation, revenus, garant, note… et la <b>date de la visite</b>. L’appli compare les revenus au loyer (3 fois = vert), à titre indicatif seulement."], ["l4-visite", "info", "Visite → agenda 📅", "Dès que tu notes une visite, l’appli te propose de l’envoyer vers AgenDam ou le calendrier du téléphone, avec adresse, nom, téléphone et infos du dossier."], ["l4-visite", "copy", "Copier pour AgenDam", "Le code se colle dans AgenDam. Le fichier .ics (calendrier du téléphone) contient un rappel 1 h avant."], ["f4-dossier", "p", "Après la visite : le dossier de pièces", "Le courrier « Demande du dossier » contient un 2e formulaire : une case par pièce (identité, domicile, contrat, bulletins de salaire, avis d’imposition, garant). Tu enregistres les pièces reçues dans Fichiers, tu les sélectionnes dans l’appli et elles sont rattachées à la fiche."], ["l6-keep", "ok", "4 · Retenir le candidat", "Début du bail, loyer, dépôt de garantie (2 mois maximum en meublé, 1 en vide) : le locataire est créé avec son dossier et l’arrivée est préparée."], ["l5-permis", "warn", "À part : le permis de louer 🔑", "Si ton logement est dans une commune qui l’impose (comme le centre ancien d’Istres), un gros rappel s’affiche avant d’ajouter un candidat : l’autorisation de la mairie est à obtenir <b>avant la signature du bail</b>."], ["l5-permis", "svc", "Les coordonnées de la mairie", "Service, adresse, téléphone cliquable (préremplis pour Istres, à saisir pour une autre commune)."], ["l5-permis", "rdv", "Rendez-vous et visites de contrôle", "Tu notes le RDV en mairie, la visite de contrôle, la 2e visite : chacun part vers ton agenda."], ["l5-permis", "let", "La lettre de demande", "Un PDF de demande d’autorisation, prêt à envoyer. Tu notes ensuite « Demande déposée » puis « Autorisation obtenue »."]]}, {"em": "🚪", "t": "Arrivée et départ : les check-lists", "p": "Onglet Biens › Arrivée/Départ : une liste pour le départ d’un locataire, une pour l’arrivée du suivant. Rien n’est oublié.", "s": [["m0a-boutons", "dep", "Le gros bouton « Départ du locataire »", "Dans Biens, sous le nom du locataire, le gros bouton « 🚪 Départ du locataire » ouvre la démarche de départ pas à pas ; sur l’écran Arrivée/Départ, « Clôturer le locataire » enregistre la date de fin de bail. Sans locataire, le bouton devient « 🔑 Arrivée d’un locataire »."], ["m0a-boutons", "dk", "Le Dossier du bail", "À côté, « 📦 Dossier du bail » : tu coches les documents à envoyer et l’appli les assemble en un seul PDF."], ["m0d-explic", "h", "Ce qui t’attend", "En touchant « Départ du locataire », une fenêtre explique le déroulé en trois temps : préparatif, jour J pas à pas, dossier d’envoi."], ["m0e-avance", "adv", "Prépare avant le jour J", "Dans le préparatif de l’arrivée, « Gagne du temps » : tu prépares le bail et tu l’envoies en pré-lecture au locataire (bouton dans le bail), tu prépares aussi l’état des lieux et l’inventaire. Au départ : la lettre de rappel, l’état des lieux et l’inventaire de sortie se préparent aussi d’avance. Le jour J, ils sont marqués « attend le jour J » : il ne reste qu’à vérifier et faire signer."], ["m0c-intro", "t", "Prêt pour le jour J ?", "Avant de démarrer, l’appli liste les étapes qui vont s’enchaîner. « ▶ Démarrer le jour J » lance la première."], ["m0b-jourj", "cur", "Jour J : une étape à la fois", "En touchant « Départ du locataire », une fenêtre t’explique le déroulé. Arrivée/Départ se fait en trois temps : Préparatif, Jour J, Après. Au Jour J, l’étape en cours est en grand avec un bouton qui ouvre le bon document (état des lieux, inventaire, signatures…). Tu le remplis, tu fais signer, puis « ✓ Fait, étape suivante ». À la fin, un gros bouton « 📦 Dossier d’envoi » assemble tout (avec « Relire le PDF » avant l’envoi)."], ["m0-mvt", "i", "Deux listes à cocher", "Tu coches chaque étape au fur et à mesure : la date du jour s’inscrit à côté, et le compteur (ici 2/11) passe au vert quand tout est fait. Les boutons ouvrent directement le bon document."], ["m1-dep", "a", "Départ 1 · Le congé et la date", "Congé reçu et vérifié : préavis du locataire de 1 mois en meublé, 3 mois en logement vide ; côté bailleur, 3 mois (meublé) ou 6 mois (vide) avant la fin du bail, avec un motif légal. Puis la date de départ, et le bouton « Lettre de rappel » qui dit au locataire quoi préparer."], ["m2-dep", "a", "Départ 2 · Inventaire et état des lieux de sortie", "Les boutons ouvrent l’inventaire et l’état des lieux de sortie, repris de ceux de l’entrée : les éléments plus dégradés ressortent en rouge. Puis les signatures, un exemplaire chacun."], ["m3-dep", "a", "Départ 3 · Clés, argent, dépôt", "Clés rendues, compteurs relevés, nouvelle adresse notée. Solde des loyers à jour (lettre d’impayé prête si besoin). Retenues justifiées par devis ou factures, en tenant compte de la vétusté. Dépôt restitué sous 1 mois si l’état de sortie est conforme, 2 mois sinon : « Lettre de restitution » en un appui."], ["m4-dep", "a", "Départ 4 · Pour finir", "Dernière quittance et solde de tout compte, puis le locataire est clos dans l’appli (date de fin du bail) et le bien est prêt pour la prochaine location."], ["m5-arr", "a", "Arrivée 1 · Dossier, diagnostics, bail", "Dossier du candidat vérifié (seulement les pièces autorisées), puis, si ton logement est soumis au permis de louer, une étape « Permis de louer » avec un bouton vers le suivi de la demande, diagnostics à jour (DPE, risques, plomb, électricité, gaz, amiante selon le logement), puis bail préparé et relu avec le locataire grâce au PDF de relecture."], ["m6-arr", "a", "Arrivée 2 · Inventaire, état des lieux, signatures", "En meublé, l’inventaire du mobilier d’entrée est obligatoire ; l’état des lieux d’entrée se fait pièce par pièce avec photos (le locataire peut le compléter sous 10 jours). Tout est signé par les deux parties."], ["m7-arr", "a", "Arrivée 3 · Dépôt, clés, assurance, fiche", "Dépôt de garantie reçu (2 mois maximum en meublé, 1 mois en vide), clés remises et compteurs relevés, attestation d’assurance habitation reçue, puis le locataire enregistré dans l’appli avec dates, loyer, charges et dépôt."]]}, {"em": "👤", "t": "Le dossier du locataire", "p": "Onglet Biens › Locataires : la fiche, ce qu’il doit, l’état des lieux, l’inventaire, le bail et les lettres. Tout ce qui le concerne est réuni ici.", "s": [["d0-solde", "s", "Le solde et l’historique", "Sous la fiche du locataire : ce qu’il a payé et ce qu’il doit depuis le début du bail, mois par mois. Pratique avant l’état de sortie et la restitution du dépôt. En bas, les anciens locataires restent consultables."], ["d1-edl", "edl", "Les états des lieux", "Les PDF ont une mise en page soignée (bandeau, tableaux colorés, états en couleur). « Nouvel état d’entrée », « État de sortie », ou « Importer un état déjà fait ». En dessous : la liste de tous les états du bien, à rouvrir quand tu veux."], ["d4-edlsheet", "f", "Préparer à l’avance", "Tu peux reprendre la liste d’un autre logement, ou importer un ancien état (PDF, Excel, CSV) : l’appli le recopie vierge, sans les états."], ["d6-edl", "top", "L’état d’entrée : l’en-tête", "Date, locataire, relevés des compteurs (électricité, eau, gaz), nombre de clés remises et détecteur de fumée."], ["d6b-room", "etat", "Pièce par pièce, en vue compacte", "Les pièces sont dépliées et chaque élément tient sur une ligne : son nom et son état (Neuf, Bon, Moyen, Mauvais). Le bouton ＋ ouvre l’observation, « + Photo » et « Supprimer » de cet élément, et devient 📝 dès qu’il y a une note ou une photo. Les photos restent sur le téléphone et sont jointes au PDF."], ["e2-compact", "bt", "Vue compacte ou détaillée", "Pendant la visite, tu vois toute la pièce d’un coup d’œil, sans faire défiler de grandes cartes. Un bouton en haut de l’état des lieux bascule entre « Vue compacte (d’ensemble) » et « Vue détaillée », avec les observations et photos toujours visibles."], ["d7-sortie", "ref", "L’état de sortie reprend l’entrée", "Tu choisis l’état d’entrée à comparer. Si tu as l’exemplaire d’entrée en fichier (PDF, Excel ou CSV), l’appli le reprend et crée directement la version de sortie."], ["d8-edlsortie", "w", "Ce qui est plus dégradé ressort", "Pour chaque élément, l’état d’entrée est rappelé, et un message rouge apparaît si l’état de sortie est plus dégradé. Les compteurs d’entrée sont rappelés en haut."], ["d1b-inv", "inv", "L’inventaire du mobilier", "Pour un meublé : « Nouvel inventaire d’entrée », « Inventaire de sortie » ou « Importer un inventaire déjà fait ». Les logements vides n’ont pas cette carte."], ["d9-inv", "g", "Les articles, en vue compacte", "La liste minimale du décret n° 2015-981 est déjà là, toutes les catégories dépliées : une ligne par article avec la quantité et l’état. Le bouton ＋ ouvre l’observation. Tu ajoutes tes propres articles ou tu colles une liste. À la sortie, l’entrée est rappelée sous chaque article."], ["i2-compact", "bt", "Vue d’ensemble pendant la visite", "Le bouton « Vue détaillée / Vue compacte (d’ensemble) » change l’affichage en un appui. La vue compacte montre tout l’inventaire en un ou deux écrans : plus besoin de faire défiler de grosses fiches."], ["d10-pdf", "all", "PDF, relecture et signature", "« Créer le PDF » ouvre le PDF et propose « Envoyer au locataire » (bouton du même nom sur chaque PDF). Le « PDF de relecture » s’ouvre dans l’appli, avec « Toutes les pages » pour tout relire avant de signer. Puis la signature à l’écran ou sur papier, et « Garder comme modèle » pour réutiliser la liste sur un autre logement."], ["d11-papier", "ol", "Signer à la main : imprimer, signer, rescanner", "Le locataire (ou toi) veut absolument signer sur papier, ou la signature à l’écran n’est pas possible ? Sur le bail, l’état des lieux ou l’inventaire, touche « Signer sur papier (1 page à imprimer) ». L’appli ajoute à chaque page une référence unique et prépare une dernière page « PAGE DE SIGNATURE ». Tu n’imprimes que cette page (chez toi, au tabac, à la mairie, ou le locataire de son côté) ; bailleur et locataire la signent et la paraphent à la main."], ["d11-papier", "b2", "Puis : scanner et renvoyer", "1 · « Enregistrer le PDF » (il reste aussi dans les documents du logement). 2 · « Scanner la page signée » (photo ou PDF déjà pris) ou « Photographier la page » : l’appareil photo s’ouvre directement, pose la page à plat, bien éclairée ; elle est rangée avec le dossier. Vérifie que la référence est lisible. L’appli range alors dans les documents du logement un PDF « SIGNÉ » unique (le document + la page signée à la main en dernière page) : c’est ton exemplaire à archiver. Un message « ✓ Page signée enregistrée » confirme chaque étape. 3 · « Envoyer le dossier signé » : la fenêtre « Envoyer au locataire » s’ouvre avec ce PDF signé. Pour un bail plus solide, fais parapher chaque page à la main ; en cas de doute, ANIL, notaire ou avocat."], ["d2-bail", "bail", "Le bail meublé", "Un bail rempli avec les données du bien et du locataire, au format PDF. Avant de signer, un « PDF de relecture » sans signature permet de le relire avec le locataire."], ["d3-bailsheet", "f", "Le formulaire du bail", "Bailleur, locataire, logement, loyer, dépôt, durée… L’appli vérifie les points essentiels avant de créer le PDF."], ["d5a-lettres", "c", "Les lettres", "Dans la fiche du logement, la carte « Bail et lettres » : loyer impayé, attestation de loyer, restitution du dépôt, rappel avant l’état des lieux de sortie : le PDF est créé en un appui."], ["d5-lettre", "sig", "Signer à l’écran ✍️", "Tu signes au doigt (et le locataire aussi pour la restitution du dépôt). Le PDF signé est rangé dans les documents du logement. En touchant « Continuer », la fenêtre « Envoyer au locataire » s’ouvre : pièce jointe, e-mail, SMS, « Ranger dans sa fiche » ou Fichiers."], ["e1-envoi", "mail", "Le même bouton partout", "Bail, lettres, quittance, état des lieux, inventaire : le PDF créé propose toujours « Envoyer au locataire », et la même fenêtre s’ouvre."], ["e1-envoi", "info", "Envoyer au locataire", "Partout où l’appli crée un PDF pour le locataire (bail, état des lieux, inventaire, lettres, quittance, restitution du dépôt, dossier signé sur papier), une même fenêtre « Envoyer au locataire » s’ouvre. Ses coordonnées sont déjà connues : tout se décide au même endroit."], ["e1-envoi", "fiche", "Ranger une copie dans sa fiche", "La case est cochée par défaut : une copie du PDF (signé s’il l’est) est gardée dans Biens › Locataires › sa fiche › Documents, et aussi dans la carte du bien (États des lieux, Inventaire, Bail et lettres) avec la mention « fiche locataire ». Même chose pour chaque document."], ["e1-envoi", "mail", "Outlook ou Mail, avec le fichier", "Un seul bouton : « Outlook ou Mail avec le fichier ». Sur téléphone, une fenêtre t’explique : tu touches Continuer, l’adresse du locataire est copiée, tu choisis Mail ou Outlook, le message s’ouvre avec le PDF déjà joint ; il reste à coller l’adresse dans « À » (doigt appuyé, Coller) et à envoyer. Sur ordinateur, le bouton télécharge un brouillon Outlook (.eml) : un double-clic l’ouvre avec adresse, message et fichier prêts. Le message est « Bonjour Camille, Voici « … » en fichier joint »."], ["e1-envoi", "sms", "SMS au locataire", "« SMS au … » ouvre Messages avec le numéro et le texte déjà écrits. Un SMS ne peut pas porter le PDF : pour l’envoyer avec le fichier, utilise le bouton Outlook ou Mail."], ["e1-envoi", "save", "Enregistrer sur l’appareil, puis envoyer", "« Enregistrer sur l’appareil (Fichiers…) » garde le PDF où tu veux, et la fenêtre reste ouverte : tu enchaînes avec l’envoi par mail ou SMS. « Seulement ranger dans la fiche » garde la copie sans rien envoyer."], ["d14-factures", "carte", "Les factures du bien", "Dans Documents, la carte « Factures du bien » : tu scannes ou ajoutes tes factures (plusieurs d’un coup), elles se rangent avec une vignette, le fournisseur, la date et le montant."], ["d14-factures", "send", "Envoyer plusieurs factures ensemble", "Tu coches les vignettes voulues puis « Envoyer » : l’appli assemble un seul PDF (liste, total et factures) et propose de l’envoyer par mail."], ["d15-comparer", "carte", "Comparer deux documents", "Dans Documents, la carte « Comparer » : « Entrée / Sortie » pour voir ce qui a changé, « Original / Retranscrit » pour vérifier qu’un document importé a été bien lu."], ["d15b-entsor", "diff", "Entrée / Sortie, ligne par ligne", "Chaque élément est aligné avec son état d’entrée et de sortie. Ce qui est pire, manquant ou ajouté est surligné ; le filtre « Différences » ne garde que ça, et le bouton PDF fabrique le comparatif à envoyer."], ["d15c-orig", "retr", "Original / Retranscrit", "À gauche ton document importé, à droite ce que l’appli en a lu (sur iPad côte à côte, sur iPhone en deux onglets). Un PDF non scanné est lu en entier (pièces, états, clés, bailleur, locataire) et refabriqué au format de l’appli ; les lignes douteuses sont marquées ⚠. Un scan est lu aussi (croix manuscrites comprises). Quand c’est bon : « ✅ Valider la retranscription » crée le PDF d’entrée dans la fiche du locataire et prépare la sortie, affichée à droite de l’entrée ; « La sortie est prête » la signale sous le nom du locataire. Sinon « ✏️ Corriger » ou « ↻ Relire »."], ["d18-validite", "vue", "Les documents, bien par bien", "La « Vue d’ensemble des biens » montre en un coup d’œil, pour chaque bien, quels diagnostics sont à jour (✓), bientôt périmés (⏳), périmés (✗), manquants (–) ou non concernés (·). Plus bas, les pièces sont séparées entre celles du bien et celles de la location. Chaque pièce (DPE, ERP, plomb, électricité, gaz, amiante, assurance…) a sa date d’édition et sa durée de validité. D’un coup d’œil : à jour, expire bientôt, périmé ou à refaire pour le nouveau locataire. Le ⚙ règle la durée de chaque pièce. À l’import, l’appli lit la date écrite sur le document et vérifie son type ; le 📅 permet de la corriger. Un bandeau rouge en haut de chaque bien (et sur l’accueil) signale tout document périmé ou à refaire."], ["d17-visale", "carte", "Visale et garanties", "Sur la fiche du locataire, tu choisis sa garantie loyers impayés (Visale, assurance privée, autre), avec numéro de visa, date de validité, contact, lien direct et contrat importé. L’onglet Biens › Visale réunit tout, avec une alerte quand la garantie expire."], ["d16-classeur", "filtres", "Le classeur de tous les documents", "Tous tes scans et imports de tous les biens au même endroit : tu filtres par bien ou par type, tu tries par date, nom ou type, tu cherches, tu renommes un document pour t’y retrouver, tu le ranges dans un autre bien, et tu coches plusieurs documents pour les envoyer en un seul PDF."], ["d13-dossier", "liste", "Dossier du bail : tout en un seul PDF", "Dans Biens › Documents, « Préparer et envoyer le dossier du bail » liste les documents du logement : bail, pièces à joindre (diagnostics, ERP…), état des lieux, inventaire. Tu coches ce qui doit partir. Les documents Word ou Excel ne peuvent pas être assemblés : ils sont grisés, à joindre à part."], ["d13-dossier", "go", "Assembler et envoyer", "« Assembler et envoyer » crée un seul PDF avec une page de garde (le sommaire), puis ouvre la fenêtre « Envoyer au locataire » : bouton Outlook ou Mail, copie dans sa fiche… « Assembler (enregistrer) » garde juste le fichier."], ["d12-range", "c", "Le PDF rangé est visible partout", "Une fois rangé, le PDF apparaît dans la carte du document concerné (ici l’inventaire) avec « Ouvrir », en plus de la fiche du locataire. Rien à chercher."], ["v1-verrou", "ban", "Un document signé est verrouillé 🔒", "Une fois l’état des lieux ou l’inventaire signé, ses champs ne se modifient plus : le dossier reste intact. En cas d’erreur, « Déverrouiller (exceptionnel) » ouvre le document, mais la première modification efface les signatures et il faut le faire signer de nouveau."]]}, {"em": "📁", "t": "Les documents du bien", "p": "Onglet Biens › Documents : les modèles vierges à imprimer, les pièces à joindre au bail et les papiers du logement.", "s": [["l0-docs", "mod", "Modèles vierges à imprimer", "Bail, état des lieux, inventaire, lettres types : des PDF sans aucune donnée, à imprimer et remplir à la main. Pour un document rempli avec un locataire, va dans Locataires."], ["l0-docs", "ann", "Pièces à joindre au bail", "Importe chaque pièce une fois (diagnostics, notice d’information…) : elle est cochée ici et jointe à l’annexe du bail."], ["l0b-docs", "aut", "Documents du bien", "DPE, assurance PNO, taxe foncière, copropriété… gardés avec le dossier du logement, sur ton téléphone."]]}, {"em": "📊", "t": "La compta", "p": "Tout ce qu’il faut pour remplir ta compta en ligne, sans rien oublier.", "s": [["c1-an", "an", "L’année en gros", "Tu changes d’année avec les pastilles. Une fois fini : « Clôturer : compta faite » et l’année s’affiche en vert."], ["c1-an", "site", "Date limite et site de compta", "Tu notes la date limite publiée chaque printemps et le site que tu utilises (facultatif) : l’appli te rappelle « Vous avez jusqu’au… »."], ["c2-saisir", "tabs", "À saisir sur le site", "Dépenses, recettes, échéances d’emprunt, logement par logement. Tu coches une ligne, un mois ou tout."], ["c2-saisir", "do", "Marquer comme saisi", "Une erreur ? Touche « Annuler » dans le bandeau qui s’affiche juste après, ou ouvre « Déjà saisi » puis « Remettre à saisir »."], ["c2-saisir", "do2", "Replier la liste", "Le bouton « Replier » en haut de la carte cache toute la liste : la liasse fiscale, « Détails, chiffres et export » et le reste sont alors visibles sans faire défiler. « Déplier » la rouvre."], ["c2-saisir", "vue", "Vue d’ensemble", "Tout ce qu’il faut saisir, d’un coup d’œil, avec zoom."], ["c3-vue", "c", "Pour le jour où tu es devant le site", "Une case par ligne, un filtre « reste à saisir », et un PDF à imprimer (complet ou seulement le reste)."], ["c4-liasse", "l", "La liasse fiscale", "Importe le PDF ou la photo de chaque année pour la retrouver ici. Les chiffres et la liste « À ne pas oublier » sont dans « Détails »."], ["c5-emprunt", "i", "Importer l’échéancier de la banque", "Dans Compta › Emprunt et intérêts, touche « Renseigner » puis « Importer l’échéancier de la banque » : PDF, scan, Excel ou CSV. L’appli lit le tableau, vérifie chaque ligne et reconstruit les échéances exactes. Tu compares les intérêts de chaque année avec ceux de ta banque, puis « Utiliser cet échéancier ». Les intérêts et l’assurance de la compta sont alors ceux de la banque, année après année (exemple avec un prêt fictif)."], ["c6-echeancier", "p", "Où en est mon prêt ?", "Sur la carte Emprunt, touche « Échéancier complet ». Tu vois le capital restant dû aujourd’hui, les intérêts déjà payés, ce qu’il reste à payer, une barre de progression et le capital restant dû à la fin de chaque année. Touche une année pour voir ses échéances mois par mois ; les lignes grisées sont à venir. Boutons Excel et PDF en bas (exemple avec un prêt fictif)."]]}, {"em": "📈", "t": "Le bilan", "p": "Les chiffres de l’année, bien par bien.", "s": [["g1-bilan", "c", "Cash flow et performance", "Cash flow, bilan par bien, performance mois par mois, toutes les années. Export Excel ou PDF d’un mois ou d’une année."], ["g2-analyse", "c", "Pourquoi mes années sont différentes ?", "Une page dédiée dans le Bilan. Tu choisis deux années (et un bien) : l’appli montre le cash flow de chacune, l’écart, les raisons principales et un graphique. Vert à droite = ça améliore le cash flow, rouge à gauche = ça le baisse. En bas de la page, deux boutons exportent l’analyse en Excel ou en PDF."], ["g3-cat", "c", "Par catégorie", "Un tableau des deux années, catégorie par catégorie, avec l’effet de chacune sur le cash flow. Touche une ligne pour voir les opérations de chaque année : dépense ponctuelle, mensualité manquante, montant qui a changé…"], ["g4-mois", "c", "Mois par mois", "Loyers, charges et cash flow de chaque mois pour les deux années. Les mois qui s’écartent le plus sont surlignés, avec ce qui les explique (taxe foncière payée un autre mois, dépense ponctuelle…). Touche un mois pour voir le détail de chaque opération : date, libellé de ce qui a été acheté, fournisseur et note, année contre année. Pratique pour comprendre pourquoi une année est meilleure qu’une autre."]]}, {"em": "⚙️", "t": "Les réglages", "p": "Tout est centralisé ici, rangé en 5 onglets.", "s": [["s1-biens", "seg", "Cinq onglets", "<span class=\"k\">Biens</span>, <span class=\"k\">Données</span>, <span class=\"k\">Aspect</span>, <span class=\"k\">Règles</span>, <span class=\"k\">Aide</span>. Plus besoin de défiler pour trouver un réglage."], ["s1c-idb", "id", "Ta pièce d’identité de bailleur", "Dans Biens, la carte « Bailleur et biens » permet de ranger ta pièce d’identité sur l’appareil. Quand tu fais signer à l’écran, la case « Ma pièce d’identité jointe » est alors cochée toute seule dans « Renforcer la preuve »."], ["s1e-bailleur", "id", "La fiche bailleur", "Réglages › Bailleur et biens › « Modifier le bailleur » : nom, adresse personnelle, téléphone, e-mail, statut (LMNP, location vide…), SIRET, régime fiscal, centre de gestion, comptable, assurance PNO, IBAN."], ["s1e-bailleur", "pdf", "La fiche bailleur imprimable", "« Fiche bailleur (PDF) » imprime une page avec ton identité, ton statut, le nombre de biens, puis chaque bien : adresse, description, locataire, bail, loyer, dépôt et permis de louer."], ["s1b-permis", "p", "Permis de louer", "Tu indiques les logements concernés et la commune ; coordonnées de la mairie à renseigner si ce n’est pas Istres."], ["s1c-permispage", "big", "La page Permis de louer", "Le bouton « Ouvrir la page Permis de louer » (Réglages) rassemble tout : un gros bouton « Déposer mon dossier en ligne » qui ouvre le formulaire de
